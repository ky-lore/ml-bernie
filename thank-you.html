<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Thanks — M. L. Bernie Co.</title>
<meta name="robots" content="noindex" />
<link rel="icon" type="image/png" href="logo-mark-gold.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root{--black:#0c0c0d;--panel:#1a1a1d;--line:#2a2a2e;--gold:#c99a3b;--gold-bright:#e4bd63}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Barlow',system-ui,sans-serif;background:var(--black);color:#e7e6e2;line-height:1.6;min-height:100svh;display:flex;flex-direction:column}
  a{color:inherit;text-decoration:none}
  header{border-bottom:1px solid var(--line);padding:14px 24px;display:flex;justify-content:space-between;align-items:center;gap:16px}
  header img{height:48px;width:auto}
  .ph{font-family:'Oswald',sans-serif;font-weight:600;font-size:18px;color:#fff}
  .ph small{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold)}
  main{flex:1;display:flex;align-items:center;justify-content:center;padding:60px 16px}
  .card{max-width:560px;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:48px 40px;text-align:center}
  .mark{width:64px;height:64px;border-radius:50%;background:var(--gold);color:#1a1204;display:grid;place-items:center;margin:0 auto 24px}
  .mark svg{width:30px;height:30px}
  h1{font-family:'Oswald',sans-serif;text-transform:uppercase;font-weight:700;font-size:clamp(28px,5vw,40px);line-height:1.05;color:#fff}
  p{margin-top:16px;color:#b9b8b3;font-size:17px}
  .btns{margin-top:30px;display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
  .btn{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.06em;font-weight:600;font-size:15px;padding:14px 24px;border-radius:2px}
  .btn-gold{background:var(--gold);color:#1a1204}
  .btn-gold:hover{background:var(--gold-bright)}
  .btn-line{border:1px solid var(--line);color:#fff}
  .btn-line:hover{border-color:var(--gold)}
  @media(max-width:480px){.card{padding:36px 22px}header img{height:40px}}
</style>
</head>
<body>
<header>
  <a href="/"><img src="logo-white.png" alt="M. L. Bernie Co." /></a>
  <a class="ph" href="tel:3109656422"><small>Call to order</small>(310) 965-6422</a>
</header>
<main>
  <div class="card">
    <div class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg></div>
    <h1 id="ty-head">Thanks — we got it.</h1>
    <p>A real person from our Gardena team will get back to you the same business day. Need it sooner? Give us a call.</p>
    <p style="font-size:15px;color:#8a8a90">Mon–Fri 8am–4pm · Sat 8am–Noon</p>
    <div class="btns">
      <a class="btn btn-gold" href="tel:3109656422">Call (310) 965-6422</a>
      <a class="btn btn-line" href="/">Back to the site</a>
    </div>
  </div>
</main>
<script>
  try {
    var n = sessionStorage.getItem("mlb_lead_first");
    if (n) document.getElementById("ty-head").textContent = "Thanks, " + n + " — we got it.";
  } catch (err) { /* storage blocked */ }
</script>
</body>
</html>
